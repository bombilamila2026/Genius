<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Мой магазин обуви взуття</title>

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			font-family: Arial, sans-serif;
			background: #f2f2f2;
			margin: 0;
			padding: 20px;
		}

		header {
			background: blueviolet;
			color: white;
			padding: 25px;
			text-align: center;
			border-radius: 12px;
			margin-bottom: 25px;
		}

		.admin-panel {
			max-width: 600px;
			margin: 0 auto 30px;
			background: white;
			padding: 25px;
			border: 2px solid blueviolet;
			border-radius: 12px;
		}

		h2 {
			color: blueviolet;
			text-align: center;
		}

		label {
			display: block;
			margin-top: 15px;
			font-weight: bold;
		}

		input,
		select,
		textarea {
			width: 100%;
			padding: 12px;
			margin-top: 6px;
			border: 1px solid #aaa;
			border-radius: 6px;
			font-size: 16px;
		}

		input:focus,
		textarea:focus,
		select:focus {
			outline: none;
			border: 2px solid blueviolet;
		}

		button {
			padding: 12px;
			border: none;
			border-radius: 6px;
			background: blueviolet;
			color: white;
			font-size: 15px;
			cursor: pointer;
		}

		button:hover {
			background: purple;
		}

		.save-button {
			width: 100%;
			margin-top: 20px;
		}

		.cancel-button {
			width: 100%;
			margin-top: 10px;
			background: gray;
		}

		.catalog {
			max-width: 1200px;
			margin: auto;
		}

		.catalog h2 {
			margin-bottom: 20px;
		}

		.products {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
			gap: 20px;
		}

		.product-card {
			background: white;
			padding: 15px;
			border-radius: 12px;
			box-shadow: 0 2px 8px #00000015;
		}

		.product-card img {
			width: 100%;
			height: 200px;
			object-fit: contain;
			background: #f7f7f7;
			border-radius: 8px;
		}

		.product-card h3 {
			margin-bottom: 8px;
		}

		.price {
			color: blueviolet;
			font-size: 22px;
			font-weight: bold;
		}

		.description {
			color: #555;
			line-height: 1.5;
		}

		.sizes {
			color: #444;
			font-size: 14px;
		}

		.actions {
			display: flex;
			gap: 8px;
			margin-top: 15px;
		}

		.actions button {
			flex: 1;
		}

		.delete-button {
			background: #d32f2f;
		}

		.delete-button:hover {
			background: #a50000;
		}

		.search {
			max-width: 600px;
			margin: 0 auto 25px;
		}

		.empty {
			text-align: center;
			color: #777;
			padding: 30px;
		}

		.hidden {
			display: none;
		}

		/* Дополнительные разделы */

		.extra-section {
			max-width: 1000px;
			margin: 35px auto;
			background: white;
			padding: 20px;
			border-radius: 12px;
			box-shadow: 0 2px 8px #00000015;
		}

		.video-container {
			position: relative;
			width: 60%;
			margin: 0 auto;
			padding-bottom: 33.75%;
			height: 0;
			overflow: hidden;
			border-radius: 10px;
		}

		.video-container iframe {
			position: absolute;
			width: 100%;
			height: 100%;
			left: 0;
			top: 0;
			border: 0;
		}

		.map-container {
			width: 60%;
			height: 250px;
			margin: 0 auto;
			border-radius: 10px;
			overflow: hidden;
		}

		.map-container iframe {
			width: 100%;
			height: 100%;
			border: 0;
		}

		.music-player {
			text-align: center;
		}

		.music-player {
			text-align: center;
			max-width: 600px;
			margin: 35px auto;
		}

		footer {
			background: blueviolet;
			color: white;
			text-align: center;
			padding: 20px;
			margin-top: 35px;
			border-radius: 12px;
		}

		@media (max-width: 500px) {
			body {
				padding: 10px;
			}

			.products {
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 10px;
			}

			.product-card {
				padding: 10px;
			}

			.product-card img {
				height: 140px;
			}

			.actions {
				flex-direction: column;
			}
		}
	</style>
</head>

<body>

	<header>
		<h1>Мой магазин обуви Взуття</h1>
		<p>Добро пожаловать в наш магазин!</p>
	</header>

	<!-- Панель управления товарами -->

	<section class="admin-panel">

		<h2>Панель управления</h2>

		<form id="productForm">

			<label for="productName">Название товара:</label>
			<input type="text" id="productName" required>

			<label for="productPrice">Цена (грн):</label>
			<input type="number" id="productPrice" min="0" required>

			<label for="productDescription">Описание:</label>
			<textarea id="productDescription" rows="3"></textarea>

			<label for="productSizes">Размеры:</label>
			<input type="text" id="productSizes" placeholder="Например: 40, 41, 42, 43">

			<label for="productImage">Фотография товара:</label>
			<input type="file" id="productImage" accept="image/*">

			<label for="productImageUrl">Или ссылка на фотографию:</label>
			<input type="url" id="productImageUrl" placeholder="https://example.com/photo.jpg">

			<button type="submit" class="save-button" id="submitButton">
				Добавить товар
			</button>

			<button type="button" class="cancel-button hidden" id="cancelButton">
				Отменить редактирование
			</button>

		</form>

	</section>

	<!-- Каталог -->

	<main class="catalog">

		<h2>Наш каталог обуви</h2>

		<div class="search">
			<input type="text" id="searchInput" placeholder="Поиск товара...">
		</div>

		<div class="products" id="productsContainer"></div>

	</main>

	<!-- YouTube -->

	<section class="extra-section">

		<h2>Наше видео</h2>

		<div class="video-container">

			<iframe src="https://www.youtube.com/embed/gyZSCqWpatg?si=OOU2v2v_9gDkt8Y6" title="YouTube video player"
				allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
				referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
			</iframe>

		</div>

	</section>

	<!-- Google Maps -->

	<section class="extra-section">

		<h2>Где нас найти</h2>

		<div class="map-container">

			<iframe src="https://www.google.com/maps?q=Синельниково,Украина&output=embed" loading="lazy"
				referrerpolicy="no-referrer-when-downgrade">
			</iframe>

		</div>

	</section>

	<!-- Музыкальный плеер -->

	<section class="extra-section music-player">

		<h2>Наша музыка</h2>

		<p>Послушайте музыку во время просмотра нашего магазина</p>

		<audio controls preload="metadata">
			<source src="./Дорога к мечте.mp3" type="audio/mpeg">
			Ваш браузер не поддерживает воспроизведение музыки.
		</audio>

		<p>Дорога к мечте</p>

	</section>

	<footer>

		<p>Мой магазин обуви</p>
		<p>Спасибо, что выбираете нас!</p>

	</footer>

	<script>

		// Работа с базой данных IndexedDB

		let db;

		const request = indexedDB.open("ShoeStoreDatabase", 1);

		request.onupgradeneeded = function (event) {

			db = event.target.result;

			if (!db.objectStoreNames.contains("products")) {

				db.createObjectStore("products", {
					keyPath: "id",
					autoIncrement: true
				});

			}

		};

		request.onsuccess = function (event) {

			db = event.target.result;

			loadProducts();

		};

		request.onerror = function () {

			alert("Ошибка открытия базы данных!");

		};


		// Элементы страницы

		const productForm = document.getElementById("productForm");

		const productName = document.getElementById("productName");

		const productPrice = document.getElementById("productPrice");

		const productDescription =
			document.getElementById("productDescription");

		const productSizes = document.getElementById("productSizes");

		const productImage = document.getElementById("productImage");

		const productImageUrl =
			document.getElementById("productImageUrl");

		const productsContainer =
			document.getElementById("productsContainer");

		const searchInput = document.getElementById("searchInput");

		const submitButton = document.getElementById("submitButton");

		const cancelButton = document.getElementById("cancelButton");


		let editingId = null;

		let currentImage = "";


		// Получение всех товаров

		function getAllProducts(callback) {

			const transaction = db.transaction(
				["products"], "readonly"
			);

			const store = transaction.objectStore("products");

			const request = store.getAll();

			request.onsuccess = function () {

				callback(request.result);

			};

		}


		// Загрузка товаров

		function loadProducts() {

			getAllProducts(function (products) {

				renderProducts(products);

			});

		}


		// Отображение товаров

		function renderProducts(products) {

			productsContainer.innerHTML = "";

			const searchText = searchInput.value.toLowerCase();

			const filteredProducts = products.filter(function (product) {

				return (
					product.name.toLowerCase().includes(searchText) ||
					product.description.toLowerCase().includes(searchText)
				);

			});

			if (filteredProducts.length === 0) {

				productsContainer.innerHTML =
					'<div class="empty">Товары не найдены</div>';

				return;

			}

			filteredProducts.forEach(function (product) {

				const card = document.createElement("div");

				card.className = "product-card";

				const image = document.createElement("img");

				image.src = product.image ||
					"https://placehold.co/400x300?text=No+Photo";

				image.alt = product.name;

				const title = document.createElement("h3");

				title.textContent = product.name;

				const price = document.createElement("p");

				price.className = "price";

				price.textContent = product.price + " грн";

				const description = document.createElement("p");

				description.className = "description";

				description.textContent = product.description;

				const sizes = document.createElement("p");

				sizes.className = "sizes";

				sizes.textContent = "Размеры: " + product.sizes;

				const actions = document.createElement("div");

				actions.className = "actions";

				const editButton = document.createElement("button");

				editButton.textContent = "Изменить";

				editButton.addEventListener("click", function () {

					editProduct(product.id);

				});

				const deleteButton = document.createElement("button");

				deleteButton.textContent = "Удалить";

				deleteButton.className = "delete-button";

				deleteButton.addEventListener("click", function () {

					deleteProduct(product.id);

				});

				actions.appendChild(editButton);

				actions.appendChild(deleteButton);

				card.appendChild(image);

				card.appendChild(title);

				card.appendChild(price);

				card.appendChild(description);

				card.appendChild(sizes);

				card.appendChild(actions);

				productsContainer.appendChild(card);

			});

		}


		// Добавление и редактирование товаров

		productForm.addEventListener("submit", async function (event) {

			event.preventDefault();

			if (!db) {

				alert("База данных ещё загружается.");

				return;

			}

			const name = productName.value.trim();

			const price = Number(productPrice.value);

			const description = productDescription.value.trim();

			const sizes = productSizes.value.trim();

			let image = currentImage;

			const file = productImage.files[0];

			if (file) {

				if (!file.type.startsWith("image/")) {

					alert("Выберите файл изображения.");

					return;

				}

				if (file.size > 5 * 1024 * 1024) {

					alert("Размер фотографии не должен превышать 5 МБ.");

					return;

				}

				image = await new Promise(function (resolve, reject) {

					const reader = new FileReader();

					reader.onload = function () {

						resolve(reader.result);

					};

					reader.onerror = reject;

					reader.readAsDataURL(file);

				});

			} else if (productImageUrl.value.trim()) {

				image = productImageUrl.value.trim();

			}

			const product = {

				name: name,

				price: price,

				description: description,

				sizes: sizes,

				image: image || ""

			};

			const transaction = db.transaction(
				["products"], "readwrite"
			);

			const store = transaction.objectStore("products");

			if (editingId !== null) {

				product.id = editingId;

				store.put(product);

			} else {

				store.add(product);

			}

			transaction.oncomplete = function () {

				resetForm();

				loadProducts();

			};

			transaction.onerror = function () {

				alert("Не удалось сохранить товар.");

			};

		});


		// Редактирование товара

		function editProduct(id) {

			getAllProducts(function (products) {

				const product = products.find(function (item) {

					return item.id === id;

				});

				if (!product) return;

				editingId = id;

				productName.value = product.name;

				productPrice.value = product.price;

				productDescription.value = product.description;

				productSizes.value = product.sizes;

				currentImage = product.image;

				productImage.value = "";

				productImageUrl.value =
					product.image.startsWith("http")
						? product.image
						: "";

				submitButton.textContent = "Сохранить изменения";

				cancelButton.classList.remove("hidden");

				productForm.scrollIntoView({
					behavior: "smooth"
				});

			});

		}


		// Удаление товара

		function deleteProduct(id) {

			if (!confirm("Удалить этот товар?")) {

				return;

			}

			const transaction = db.transaction(
				["products"], "readwrite"
			);

			const store = transaction.objectStore("products");

			store.delete(id);

			transaction.oncomplete = function () {

				loadProducts();

			};

		}


		// Очистка формы

		function resetForm() {

			productForm.reset();

			editingId = null;

			currentImage = "";

			submitButton.textContent = "Добавить товар";

			cancelButton.classList.add("hidden");

		}


		cancelButton.addEventListener("click", function () {

			resetForm();

		});


		// Поиск товаров

		searchInput.addEventListener("input", function () {

			loadProducts();

		});

	</script>

</body>

</html>
